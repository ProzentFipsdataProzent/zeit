<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Der Pookie-Countdown</title>
  <style>
    * { box-sizing: border-box; }
    html { min-height: 100%; background: #141b2b; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      background: radial-gradient(ellipse at top, #202d45 0%, #141b2b 65%);
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      text-align: center;
      padding: max(20px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom));
    }
    main { width: min(100%, 680px); margin: auto; }
    h1 {
      font-size: clamp(1.45rem, 5.5vw, 2.3rem);
      line-height: 1.25;
      font-weight: 600;
      letter-spacing: -0.025em;
      margin: 0 0 clamp(24px, 6vw, 38px);
      text-wrap: balance;
    }
    .countdown { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: clamp(6px, 2vw, 12px); }
    .unit {
      min-width: 0;
      background: rgba(37, 49, 73, .92);
      border: 1px solid rgba(255,255,255,.06);
      border-radius: clamp(10px, 3vw, 16px);
      padding: clamp(13px, 4vw, 22px) 3px;
      box-shadow: 0 8px 24px rgba(0,0,0,.12);
    }
    .number { display: block; font-size: clamp(1.45rem, 7.5vw, 3.5rem); line-height: 1.1; font-weight: 750; font-variant-numeric: tabular-nums; letter-spacing: -.035em; }
    .label { display: block; margin-top: 8px; color: #cbd5e1; font-size: clamp(.62rem, 2.7vw, .95rem); line-height: 1.2; overflow-wrap: anywhere; }
    #message { margin: 26px 0 0; color: #cbd5e1; font-size: clamp(.9rem, 3.5vw, 1rem); }
    #fireworks {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
      display: none;
    }
    body.celebrating #fireworks { display: block; }
    body.celebrating main { position: relative; z-index: 1; }
    @media (max-width: 360px) {
      body { padding-left: 10px; padding-right: 10px; }
      .countdown { gap: 5px; }
      .unit { padding: 12px 2px; }
      .label { font-size: .62rem; }
    }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }
  </style>
</head>
<body>
<canvas id="fireworks" aria-hidden="true"></canvas>
<main>
  <h1 id="headline"></h1>
  <div class="countdown" aria-live="off">
    <div class="unit"><span class="number" id="days">0</span><span class="label">Tage</span></div>
    <div class="unit"><span class="number" id="hours">00</span><span class="label">Stunden</span></div>
    <div class="unit"><span class="number" id="minutes">00</span><span class="label">Minuten</span></div>
    <div class="unit"><span class="number" id="seconds">00</span><span class="label">Sekunden</span></div>
  </div>
  <p id="message"></p>
</main>
<script>
  // HIER ÄNDERN:
  const wiedersehen = "2026-10-14T21:12:30"; // Datum, Uhrzeit und Zeitzone
  // Beispiel Sommerzeit in Deutschland: +02:00, Winterzeit: +01:00

  document.getElementById("headline").textContent = "Zeit bis sich die Pookies wiedersehen:";
  const ziel = new Date(wiedersehen).getTime();
  let feuerwerkGestartet = false;
  let feuerwerkBis = 0;
  let animationId = null;
  const canvas = document.getElementById("fireworks");
  const ctx = canvas.getContext("2d");
  const partikel = [];
  let letzteExplosion = 0;

  function canvasAnpassen() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(window.innerWidth * dpr);
    canvas.height = Math.floor(window.innerHeight * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener("resize", canvasAnpassen);
  canvasAnpassen();

  function explodieren() {
    const x = Math.random() * window.innerWidth * 0.84 + window.innerWidth * 0.08;
    const y = Math.random() * window.innerHeight * 0.55 + window.innerHeight * 0.08;
    const farbe = ["#ff5c8a", "#ffd166", "#72ddf7", "#b8f2a1", "#c8a2ff", "#ffffff"][Math.floor(Math.random() * 6)];
    const anzahl = 55 + Math.floor(Math.random() * 35);
    for (let i = 0; i < anzahl; i++) {
      const winkel = Math.random() * Math.PI * 2;
      const tempo = Math.random() * 4.5 + 1.2;
      partikel.push({ x, y, vx: Math.cos(winkel) * tempo, vy: Math.sin(winkel) * tempo,
        life: 55 + Math.random() * 35, maxLife: 90, farbe, radius: Math.random() * 2.4 + 1 });
    }
  }
  function feuerwerkZeichnen(zeit) {
    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    if (zeit - letzteExplosion > 430) {
      explodieren();
      if (Math.random() > 0.35) explodieren();
      letzteExplosion = zeit;
    }
    for (let i = partikel.length - 1; i >= 0; i--) {
      const p = partikel[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.035;
      p.vx *= 0.99;
      p.vy *= 0.99;
      p.life -= 1;
      if (p.life <= 0) { partikel.splice(i, 1); continue; }
      ctx.globalAlpha = Math.min(1, p.life / 25);
      ctx.fillStyle = p.farbe;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    if (zeit < feuerwerkBis || partikel.length > 0) {
      animationId = requestAnimationFrame(feuerwerkZeichnen);
    } else {
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      document.body.classList.remove("celebrating");
      animationId = null;
    }
  }
  function feuerwerkStarten() {
    if (feuerwerkGestartet) return;
    feuerwerkGestartet = true;
    feuerwerkBis = performance.now() + 12000;
    letzteExplosion = 0;
    document.body.classList.add("celebrating");
    explodieren();
    explodieren();
    animationId = requestAnimationFrame(feuerwerkZeichnen);
  }

  function aktualisieren() {
    if (!Number.isFinite(ziel)) {
      document.getElementById("message").textContent = "Bitte ein gültiges Datum eintragen.";
      return;
    }
    const rest = Math.max(0, ziel - Date.now());
    const sekunden = Math.floor(rest / 1000);
    const werte = [Math.floor(sekunden / 86400), Math.floor(sekunden / 3600) % 24, Math.floor(sekunden / 60) % 60, sekunden % 60];
    ["days", "hours", "minutes", "seconds"].forEach((id, i) => {
      document.getElementById(id).textContent = i === 0 ? werte[i] : String(werte[i]).padStart(2, "0");
    });
    document.getElementById("message").textContent = rest === 0 ? "Die Pookies sind vereint!" : "";
    if (rest === 0) feuerwerkStarten();
  }
  aktualisieren();
  setInterval(aktualisieren, 1000);
</script>
</body>
</html>
